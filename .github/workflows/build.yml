name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Susun proyek Android
        run: |
          P=proj
          mkdir -p $P/app/src/main/java/com/catatduit/app $P/app/src/main/assets $P/app/src/main/res/mipmap-xxxhdpi
          cp android-settings.gradle.kts $P/settings.gradle.kts
          cp android-build.gradle.kts $P/build.gradle.kts
          cp android-gradle.properties $P/gradle.properties
          cp android-app.gradle.kts $P/app/build.gradle.kts
          cp android-AndroidManifest.xml $P/app/src/main/AndroidManifest.xml
          cp android-Main.kt $P/app/src/main/java/com/catatduit/app/Main.kt
          cp index.html $P/app/src/main/assets/index.html
          cp icon-512.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CatatDuit-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
