# Panduan dari Nol: Dari Repo Baru sampai APK Terpasang

Semua langkah dikerjakan **dari HP**, tanpa laptop. Pelan-pelan saja, tidak perlu buru-buru. Kalau ada layar yang berbeda dari penjelasan di sini, berhenti dan ceritakan ke aku apa yang kamu lihat.

## Istilah singkat (supaya tidak bingung)

| Istilah | Artinya |
|---|---|
| **Repository (repo)** | Folder penyimpanan proyekmu di internet |
| **Commit** | Tombol "Simpan" di GitHub |
| **Actions** | "Robot" GitHub yang bekerja otomatis, di sini robot pembuat APK |
| **Workflow** | Daftar perintah untuk si robot |
| **APK** | File aplikasi Android yang dipasang di HP |

**Gambaran besarnya:** kamu mengunggah file ke GitHub, robot membuat APK-nya sekitar 5 menit, lalu kamu mengunduh dan memasangnya.

---

## FASE 1. Siapkan file di HP (5 menit)

1. Buka aplikasi **Files** (atau File Manager) di HP.
2. Cari `catatduit-repo-baru.zip`. Biasanya ada di folder **Download**.
3. Tekan file zip-nya, lalu pilih **Ekstrak** (atau Extract). Tekan **Selesai** atau **Done**.
4. Akan muncul folder `catatduit-repo-baru` berisi **12 file**. Cek kamu melihat nama-nama ini:
   - `index.html`, `manifest.webmanifest`, `sw.js`
   - `icon-180.png`, `icon-192.png`, `icon-512.png`
   - `android-Main.kt`, `android-AndroidManifest.xml`, `android-app.gradle.kts`, `android-build.gradle.kts`, `android-settings.gradle.kts`, `android-gradle.properties`

Kalau ada 12 file, Fase 1 selesai.

---

## FASE 2. Buat repo baru di GitHub (5 menit)

1. Buka **Chrome**, lalu masuk ke **github.com** dan login. Kalau belum login, tekan **Sign in**.
2. Tekan tanda **+** di pojok kanan atas, lalu pilih **New repository**.
   Kalau tidak ketemu, buka alamat `github.com/new` langsung.
3. Isi form:
   - **Repository name:** `catatduit-app`
   - **Description:** boleh dikosongkan
   - **Public / Private:** pilih **Private** (supaya hanya kamu yang bisa lihat)
   - **Add a README file:** biarkan **tidak dicentang**
4. Gulir ke bawah, lalu tekan tombol hijau **Create repository**.

Kamu akan masuk ke halaman repo kosong dengan tulisan "Quick setup".

---

## FASE 3. Unggah 12 file (5 menit)

1. Di halaman repo kosong tadi, cari tulisan biru **uploading an existing file** dan tekan.
   Kalau repo-nya sudah berisi sesuatu, tekan **Add file**, lalu **Upload files**.
2. Kalau tampilannya tidak ada tombol upload, buka menu ⋮ di Chrome dan aktifkan **Situs desktop** (Desktop site), lalu muat ulang.
3. Tekan **choose your files**. Akan terbuka pemilih file HP.
4. Buka folder `catatduit-repo-baru`, lalu **pilih semua 12 file**. Cara cepat: tekan lama satu file, lalu pilih **Pilih semua** (Select all).
5. Tekan **Buka** atau **Pilih**. Tunggu sampai ke-12 nama file muncul di daftar, dan semua batang progres penuh.
6. Gulir ke bawah dan tekan tombol hijau **Commit changes**.

Hasilnya, halaman repo sekarang menampilkan 12 file.

---

## FASE 4. Buat file "robot pembuat APK" (5 menit)

Bagian ini paling teliti, tapi cukup sekali.

1. Di halaman repo, tekan **Add file**, lalu pilih **Create new file**.
2. Di kolom nama file (tulisannya "Name your file..."), ketik persis:

   ```
   .github/workflows/build.yml
   ```

   Perhatikan: diawali **titik**, dan tanda **/** akan otomatis membuat folder. Setelah mengetik, harus tampil `.github` / `workflows` / `build.yml`.

3. Tekan kotak besar di bawahnya, lalu **tempel** (paste) isi di bawah ini. Salin dengan menekan tombol **Copy** di pojok kanan blok kode:

```yaml
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Susun proyek Android
        run: |
          P=proj
          mkdir -p $P/app/src/main/java/com/catatduit/app $P/app/src/main/assets $P/app/src/main/res/mipmap-xxxhdpi
          cp android-settings.gradle.kts $P/settings.gradle.kts
          cp android-build.gradle.kts $P/build.gradle.kts
          cp android-gradle.properties $P/gradle.properties
          cp android-app.gradle.kts $P/app/build.gradle.kts
          cp android-AndroidManifest.xml $P/app/src/main/AndroidManifest.xml
          cp android-Main.kt $P/app/src/main/java/com/catatduit/app/Main.kt
          cp index.html $P/app/src/main/assets/index.html
          cp icon-512.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CatatDuit-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
```

4. Tekan tombol hijau **Commit changes...** di pojok kanan atas. Akan muncul kotak kecil, lalu tekan **Commit changes** sekali lagi.

Begitu tersimpan, robot langsung mulai bekerja.

---

## FASE 5. Tunggu robot selesai (5 sampai 8 menit)

1. Di halaman repo, tekan tab **Actions** (di deretan menu: Code, Issues, Pull requests, **Actions**, ...). Kalau menunya terpotong, geser menu ke samping.
2. Kamu akan melihat satu baris bernama **Build APK**. Arti ikonnya:
   - 🟡 **kuning berputar:** masih bekerja, tunggu
   - ✅ **hijau:** selesai
   - ❌ **merah:** gagal. **Jangan panik.** Tekan baris itu, lalu tekan **build**, buka bagian yang bertanda merah, dan kirim pesan error-nya ke aku
3. Kalau muncul tombol hijau yang meminta kamu mengaktifkan workflow, tekan saja.

---

## FASE 6. Unduh APK (3 menit)

1. Setelah ✅ hijau, tekan baris **Build APK** tadi.
2. **Gulir jauh ke bawah** sampai bagian **Artifacts**. Di sana ada **CatatDuit-APK**.
3. Tekan **CatatDuit-APK**. File zip akan terunduh. Kalau Chrome memperingatkan file berbahaya, pilih **Simpan** atau **Keep**.
4. Buka **Files**, folder **Download**, lalu ekstrak `CatatDuit-APK.zip`. Di dalamnya ada **`app-debug.apk`**.

---

## FASE 7. Pasang aplikasi (3 menit)

1. Tekan `app-debug.apk`.
2. Android akan bertanya soal **memasang dari sumber ini** atau **sumber tidak dikenal**. Tekan **Pengaturan**, aktifkan **Izinkan dari sumber ini**, lalu tekan kembali.
3. Tekan **Pasang** atau **Install**. Kalau muncul peringatan Play Protect, pilih **Tetap instal** (Install anyway).
4. Setelah selesai, tekan **Buka**. Ikon CatatDuit juga muncul di layar aplikasi.

---

## FASE 8. Aktifkan sinkron notifikasi (5 menit)

1. Saat CatatDuit dibuka, muncul dialog **Izinkan akses notifikasi**. Tekan **Buka pengaturan**.
2. Di daftar yang muncul, aktifkan **CatatDuit**, lalu tekan **Izinkan** pada pertanyaan konfirmasinya.
3. **Kalau tombolnya abu-abu atau ada tulisan "Pengaturan dibatasi" (Android 13 ke atas):**
   - Tutup, lalu tekan lama ikon CatatDuit, pilih **Info aplikasi**.
   - Tekan ⋮ di pojok kanan atas, pilih **Izinkan pengaturan terbatas**, lalu ulangi langkah 1 dan 2.
4. Supaya tidak dimatikan sistem: **Info aplikasi CatatDuit, Baterai** lalu pilih **Tidak dibatasi**. Di HP Xiaomi, Oppo, Vivo, atau Realme, aktifkan juga **Mulai otomatis**.

---

## FASE 9. Uji coba

1. Terima uang kecil (misalnya Rp1.000) di DANA atau GoPay.
2. Buka CatatDuit dan lihat tab **Riwayat**. Kalau berhasil, ada transaksi baru berketerangan **Otomatis · DANA** atau **Otomatis · GoPay**.
3. **Kalau belum muncul**, itu normal untuk uji pertama. Format notifikasi tiap aplikasi berbeda, jadi:
   - Tekan ikon **pengaturan** (pojok kanan atas).
   - Gulir ke **Backup & ekspor**, lalu tekan **Uji: lihat notifikasi terbaca**.
   - Salin teks yang muncul di kotak dan **kirim ke aku**. Aku sesuaikan kodenya.
4. Setelah aku beri perbaikan, kamu mengubah file `android-Main.kt` di GitHub (buka file, tekan ikon ✏️, ganti isinya, lalu Commit). Robot otomatis membuat APK baru, dan kamu tinggal mengulang Fase 6 dan 7.

---

## Catatan

- Data di aplikasi APK terpisah dari versi web. Kalau ada data lama di PWA, pindahkan lewat **Backup** di PWA, lalu **Pulihkan** di APK (menu Pengaturan).
- Menu uji menyimpan 12 notifikasi terakhir yang memuat "Rp" dari aplikasi mana pun (termasuk bank), hanya di HP kamu. Setelah selesai menyesuaikan kode, kamu bisa memintaku menghapusnya.
- Transaksi otomatis tidak melewati pengecekan saldo, jadi saldo bisa minus. Kalau ada yang salah baca, hapus dari Riwayat.
- Repo lama `catatduit` tidak terpengaruh dan boleh dibiarkan.
- Ini APK debug untuk pemakaian pribadi, bukan untuk Play Store.
